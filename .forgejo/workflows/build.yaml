# CI half of the GitOps loop: push to main → build image → push to Harbor →
# bump deploy/kustomization.yaml → Argo CD rolls clusterscape.lan.
# `[skip ci]` on the bump commit prevents self-retriggering.
name: build-and-deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        run: |
          echo "$HARBOR_TOKEN" | docker login harbor.lan -u "$HARBOR_USER" --password-stdin

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE="harbor.lan/apps/clusterscape"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Bump image tag in deploy manifests
        run: |
          TAG="${GITHUB_SHA::12}"
          sed -i "s|newTag:.*|newTag: $TAG|" deploy/kustomization.yaml
          git config user.name "forgejo-actions"
          git config user.email "actions@forgejo.lan"
          git add deploy/kustomization.yaml
          git commit -m "deploy: image $TAG [skip ci]"
          git push origin main
